# Lance l'application à partir des images PUBLIEES par la CI (rien n'est reconstruit).
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Choisir une version d'image (par défaut : latest) :
#   $env:VERSION="1.0"; docker compose -f docker-compose.prod.yml up -d
#
# Frontend : http://localhost        (port 80)
# Backend  : http://localhost:8000   (docs : http://localhost:8000/docs)
#
# Les modèles ne sont pas dans les images : récupérez-les avant
# (dvc pull models/convnext-tiny.onnx.dvc models/convnext-tiny.pt.dvc).

services:
  backend:
    image: ghcr.io/ahmedfridhi71/fissures-backend:${VERSION:-latest}
    ports:
      - "8000:8000"
    environment:
      MODEL_ONNX_PATH: /models/convnext-tiny.onnx
      MODEL_PT_PATH: /models/convnext-tiny.pt
      THRESHOLD: "0.05"
    volumes:
      - ./models:/models:ro
    restart: unless-stopped

  frontend:
    image: ghcr.io/ahmedfridhi71/fissures-frontend:${VERSION:-latest}
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped