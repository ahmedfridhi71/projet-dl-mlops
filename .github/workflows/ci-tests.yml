name: CI tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Installer les dépendances du backend
        run: |
          # torch CPU d'abord (bien plus léger que la version CUDA), mêmes versions que le Dockerfile
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0 torchvision==0.26.0
          pip install -r backend/requirements.txt

      - name: Vérifier la syntaxe du code
        run: python -m compileall -q src backend/app

      - name: Lancer les tests
        # -rs : affiche les tests sautés et pourquoi (les modèles ne sont pas dans Git)
        run: pytest -q -rs