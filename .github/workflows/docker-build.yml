name: Docker build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: backend
            contexte: backend
          - nom: frontend
            contexte: frontend
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Calculer les étiquettes de version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fissures-${{ matrix.nom }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Construire l'image pour le test
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          load: true
          push: false
          tags: fissures-${{ matrix.nom }}:ci
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}

      - name: Test de démarrage du backend (/health)
        if: matrix.nom == 'backend'
        run: |
          docker run -d --name smoke -p 8000:8000 fissures-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              echo "Test de démarrage OK"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Se connecter au registre GitHub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nom }}