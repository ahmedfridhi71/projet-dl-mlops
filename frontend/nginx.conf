# Configuration nginx du frontend.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Un peu plus que 10 Mo : c'est le backend qui renvoie lui-même l'erreur 413.
    client_max_body_size 11m;

    # /api/... est envoyé au backend (service "backend" de docker-compose).
    # Exemple : /api/predict -> http://backend:8000/predict
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;  # Grad-CAM peut être lent au premier appel
    }

    # Le reste : les fichiers du site React.
    location / {
        try_files $uri /index.html;
    }
}
